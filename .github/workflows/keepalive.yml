name: Keep Streamlit app awake

# Abre la app cada hora con un navegador real (Playwright + Chromium) para
# que Streamlit Community Cloud la cuente como visitada y no la "duerma"
# (se duerme tras ~12 horas sin visitas). Si estaba dormida, aprieta el
# botón para despertarla. Ver .github/scripts/keepalive.py.
#
# Ojo: GitHub solo corre los workflows programados (schedule) que están en
# la rama por defecto del repo (main) — este archivo tiene que estar ahí.
# También los pausa si el repo pasa 60 días sin commits; en ese caso hay
# que reactivarlo a mano en la pestaña Actions.

on:
  schedule:
    - cron: "17 * * * *"  # minuto 17 de cada hora (en punto GitHub se satura y atrasa)
  workflow_dispatch: {}

jobs:
  visitar:
    runs-on: ubuntu-24.04  # fijo: Playwright instala dependencias de sistema y puede no soportar aún la Ubuntu más nueva
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Abrir la app (y despertarla si está dormida)
        run: python .github/scripts/keepalive.py

      - name: Guardar captura si la app no cargó
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-error
          path: keepalive-error.png
          if-no-files-found: ignore
